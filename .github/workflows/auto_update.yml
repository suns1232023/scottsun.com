name: Auto Update Attention Telemetry

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: auto-update-telemetry
  cancel-in-progress: true

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ← 移至 job 级别，最小权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"         # ← 可选：加速依赖安装

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Telemetry Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/update_attention.py

      - name: Validate JSON
        run: |
          python -m json.tool data/attention.json > /dev/null

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/attention.json
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore: auto-update attention telemetry"
            git push
          fi
