name: Auto Update Attention Telemetry

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: auto-update-telemetry
  cancel-in-progress: true

jobs:
  update-json:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telemetry Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/update_attention.py

      - name: Validate JSON
        run: |
          python -m json.tool data/attention.json > /dev/null

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/attention.json

          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore: auto-update attention telemetry"
            git push
          fi
