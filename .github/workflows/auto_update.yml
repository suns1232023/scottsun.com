name: Auto Update Attention Telemetry

on:
  schedule:
    # 每日 UTC 18:00 (北京时间 02:00) 运行，避开 00:00 UTC 高峰期
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: auto-update-telemetry
  cancel-in-progress: true

jobs:
  update-json:
    name: Fetch Telemetry & Update Schema v3.0
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pydantic pygithub pyyaml; fi

      - name: Run Telemetry Fetcher & Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f scripts/fetch_telemetry.py ]; then python scripts/fetch_telemetry.py; fi
          python scripts/update_attention.py

      - name: Validate JSON Syntax
        run: |
          python -m json.tool data/attention.json > /dev/null

      - name: Run Scholarly Schema Audit (Smoke Test)
        run: |
          if [ -f scripts/scholarly_audit.py ]; then python scripts/scholarly_audit.py; fi

      - name: Commit and Push if Changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update attention telemetry (Schema v3.0) [skip ci]"
          file_pattern: "data/attention.json scholarly/publications.json reports/*"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
