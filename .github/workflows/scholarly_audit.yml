name: Scholarly Metadata Audit

on:
  push:
    branches: [ main, master ]
    paths:
      - 'scholarly/publications.json'
      - 'CITATION.cff'
      - 'scripts/scholarly_audit.py'
      - '.github/workflows/scholarly_audit.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'scholarly/publications.json'
      - 'CITATION.cff'
      - 'scripts/scholarly_audit.py'
  workflow_dispatch:

jobs:
  audit:
    name: Audit Publications & CITATION.cff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run scholarly audit script
        run: |
          python scripts/scholarly_audit.py

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholarly-audit-report
          path: reports/scholarly-audit.json
          retire-days: 30
