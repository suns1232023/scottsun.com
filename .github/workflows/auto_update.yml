name: Auto Update Attention Telemetry

on:
  schedule:
    # 每天 UTC 0:00（北京时间 08:00）
    - cron: '0 0 * * *'

  # 允许在 GitHub 网页界面手动触发
  workflow_dispatch:

# 避免并发任务导致 Git 冲突
concurrency:
  group: auto-update-telemetry
  cancel-in-progress: true

jobs:
  update-json:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Telemetry Updater Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TRAFFIC_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: python scripts/update_attention.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add attention.json

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: auto-update attention.json telemetry" &&
            git push
          )
